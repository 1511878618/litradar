name: Release

# 推版本 tag 生成 GitHub Release；PyPI 仅在显式启用 PUBLISH_TO_PYPI 后发布。
# PyPI 使用 Trusted Publishing（OIDC），不需要在仓库里存 token；
# 先在 PyPI 项目设置里添加 publisher：
#   Owner: 1511878618   Repository: litradar   Workflow: release.yml   PyPI upload is opt-in through the PUBLISH_TO_PYPI repository variable

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install build

      - name: Tests (no network)
        run: python tests/run_tests.py

      - name: Build sdist + wheel
        run: python -m build

      - name: Check the version matches the tag
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if version != tag:
              raise SystemExit(f"tag {tag} != pyproject version {version}")
          print("version", version)
          PY
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Build integrations
        run: |
          cd obsidian-litradar
          pnpm install --frozen-lockfile
          pnpm run build
          cd ..
          python zotero-litradar/build.py
          python - <<'PYTHON'
          import json, shutil, zipfile
          from pathlib import Path
          output = Path("release-assets")
          output.mkdir()
          plugin = Path("obsidian-litradar")
          version = json.loads((plugin / "manifest.json").read_text())["version"]
          with zipfile.ZipFile(output / f"obsidian-litradar-{version}.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              for name in ("main.js", "manifest.json", "styles.css"):
                  archive.write(plugin / name, name)
                  shutil.copy2(plugin / name, output / name)
          bridge = Path("zotero-litradar")
          version = json.loads((bridge / "manifest.json").read_text())["version"]
          shutil.copy2(bridge / f"litradar-pdf-bridge-{version}.xpi", output)
          PYTHON

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            release-assets/*

      - name: Publish to PyPI
        if: ${{ vars.PUBLISH_TO_PYPI == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
